spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false
app.jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtMzItYnl0ZXMtbG9uZy1mb3ItaHNtYWM=}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000
app.documents.storage-path=${DOCUMENT_STORAGE_PATH:./target/test-storage/documents}
app.documents.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
app.ocr.tesseract-command=${TESSERACT_COMMAND:tesseract}
app.ocr.tesseract-data-path=${TESSERACT_DATA_PATH:}
# Spring AI test - deterministic FakeAiDocumentExtractor, no external calls
app.ai.provider=test
spring.ai.openai.api-key=dummy
spring.ai.openai.chat.options.model=gpt-4o-mini
# Kafka disabled for default test suite (backward compatibility with synchronous tests)
app.kafka.enabled=false
# Redis disabled for tests - in-memory cache manager is used, no server required
spring.data.redis.repositories.enabled=false
app.redis.enabled=false
app.kafka.bootstrap-servers=localhost:9092
app.kafka.topics.document-ocr=accounting.document.ocr
app.kafka.topics.document-extraction=accounting.document.extraction
app.kafka.topics.document-dlq=accounting.document.processing.dlq
logging.level.com.example.accounting=INFO
logging.level.org.hibernate.SQL=WARN
