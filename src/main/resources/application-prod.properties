# Production profile: SPRING_PROFILES_ACTIVE=prod.
# Every secret is environment-driven. Non-sensitive host/port defaults exist only
# for optional services (Redis/Kafka). Startup fails fast when JWT_SECRET is
# missing or weak (see JwtSecretValidator).
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:accounting_db}?useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
# No usable default: JWT_SECRET is required in production. The empty default
# lets JwtSecretValidator fail with a clear message instead of a placeholder error.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
app.jwt.require-strong-secret=true
app.documents.storage-path=${DOCUMENT_STORAGE_PATH:/data/documents}
app.documents.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
app.ocr.tesseract-command=${TESSERACT_COMMAND:tesseract}
app.ocr.tesseract-data-path=${TESSERACT_DATA_PATH:}
app.ai.provider=${SPRING_AI_PROVIDER:openai}
spring.ai.openai.api-key=${SPRING_AI_API_KEY}
spring.ai.openai.chat.options.model=${SPRING_AI_MODEL:gpt-4o-mini}
# Kafka / Redis stay environment-driven; both remain disableable. The localhost
# fallback is only used when Kafka is explicitly disabled and the variable is unset.
app.kafka.enabled=${KAFKA_ENABLED:true}
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.document-ocr=${KAFKA_TOPIC_OCR:accounting.document.ocr}
app.kafka.topics.document-extraction=${KAFKA_TOPIC_EXTRACTION:accounting.document.extraction}
app.kafka.topics.document-dlq=${KAFKA_TOPIC_DLQ:accounting.document.processing.dlq}
app.redis.enabled=${REDIS_ENABLED:false}
# Redis must remain optional even when disabled: give the unused connection
# settings a harmless local default instead of failing startup on a missing host.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
# Production logging: INFO for the app, WARN for SQL. Never log bind
# parameters (they can carry PII and financial values).
logging.level.root=INFO
logging.level.com.example.accounting=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
# Actuator stays minimal; ops tooling scrapes only the health probe groups.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Never return stack traces, exception messages, or validation internals to clients.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# CORS stays disabled unless APP_CORS_ALLOWED_ORIGINS is set explicitly.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
# Graceful shutdown (also set in base config; repeated here for visibility).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
