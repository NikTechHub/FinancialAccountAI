server.port=${SERVER_PORT:8080}
spring.application.name=accounting-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
logging.level.root=INFO
logging.level.com.example.accounting=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
# Actuator: minimum externally visible surface. Business health contract stays at
# GET /api/v1/health (unchanged). Probes use the health groups below.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
# Redis is optional (app.redis.enabled=false by default): its health must never
# fail readiness or cause restart loops.
management.health.redis.enabled=false
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace
# Graceful shutdown: stop accepting new work, finish in-flight requests and
# Kafka listener work within the timeout where practical.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# HikariCP sane defaults (profiles may tune pool size; never unbounded).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
# CORS: disabled by default (empty allowlist). Set APP_CORS_ALLOWED_ORIGINS in
# environments that need browser access; never "*" in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
# JWT - MUST be overridden via environment variables in production.
# When app.jwt.require-strong-secret=true (prod profile), startup fails fast
# unless JWT_SECRET decodes to >= 32 bytes and differs from known dev defaults.
app.jwt.secret=${JWT_SECRET:QmFzZTY0U2VjcmV0Rm9ySldUU2lnbmluZ1Rlc3RTZWNyZXRUaGF0SXNTZWN1cmU=}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
app.jwt.require-strong-secret=${JWT_REQUIRE_STRONG_SECRET:false}
# Refresh token rotation / storage
app.jwt.refresh-token-rotation-enabled=true
# Document storage
app.documents.storage-path=${DOCUMENT_STORAGE_PATH:./storage/documents}
app.documents.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_FILE_SIZE:10MB}
# OCR
app.ocr.tesseract-command=${TESSERACT_COMMAND:tesseract}
app.ocr.tesseract-data-path=${TESSERACT_DATA_PATH:}
# Spring AI - provider-neutral, env-driven, dummy fallback for local/test
# Supports SPRING_AI_PROVIDER hint (openai/azure/anthropic) for future multi-provider; currently OpenAI compatible
app.ai.provider=${SPRING_AI_PROVIDER:openai}
spring.ai.openai.api-key=${SPRING_AI_API_KEY:dummy}
spring.ai.openai.chat.options.model=${SPRING_AI_MODEL:gpt-4o-mini}
# Do not fail startup when dummy key; lazy invocation via SpringAiDocumentExtractor fallback

# Kafka - asynchronous processing
app.kafka.enabled=${KAFKA_ENABLED:true}
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.document-ocr=${KAFKA_TOPIC_OCR:accounting.document.ocr}
app.kafka.topics.document-extraction=${KAFKA_TOPIC_EXTRACTION:accounting.document.extraction}
app.kafka.topics.document-dlq=${KAFKA_TOPIC_DLQ:accounting.document.processing.dlq}
app.kafka.consumer.ocr-group-id=${KAFKA_CONSUMER_OCR_GROUP:accounting-document-ocr-workers}
app.kafka.consumer.extraction-group-id=${KAFKA_CONSUMER_EXTRACTION_GROUP:accounting-document-extraction-workers}
app.kafka.consumer.max-retries=${KAFKA_CONSUMER_MAX_RETRIES:3}
app.kafka.consumer.backoff-ms=${KAFKA_CONSUMER_BACKOFF_MS:1000}
app.kafka.producer.acks=${KAFKA_PRODUCER_ACKS:all}
app.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:3}

# Redis - performance layer only (DB remains source of truth)
# No Redis repositories are used; plain RedisTemplate/CacheManager only.
spring.data.redis.repositories.enabled=false
app.redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
# Centralized TTLs (seconds, env-overridable)
app.redis.ttl.organization-seconds=${REDIS_TTL_ORG:600}
app.redis.ttl.account-tree-seconds=${REDIS_TTL_ACCOUNT_TREE:600}
app.redis.ttl.account-list-seconds=${REDIS_TTL_ACCOUNT_LIST:600}
app.redis.ttl.account-item-seconds=${REDIS_TTL_ACCOUNT_ITEM:600}
app.redis.ttl.vendor-list-seconds=${REDIS_TTL_VENDOR_LIST:300}
app.redis.ttl.vendor-item-seconds=${REDIS_TTL_VENDOR_ITEM:300}
app.redis.ttl.customer-list-seconds=${REDIS_TTL_CUSTOMER_LIST:300}
app.redis.ttl.customer-item-seconds=${REDIS_TTL_CUSTOMER_ITEM:300}
